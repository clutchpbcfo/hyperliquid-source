name: Node115 addendum validation shard
on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string
      minutes:
        required: true
        type: number
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lalalune/hyperliquid-source
          ref: 05bc2de303c05525b71e7e257426e741bc66a390
          path: acquired
          persist-credentials: false
          lfs: true
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Authenticate and validate the assigned modules offline
        working-directory: control
        env:
          SHARD: ${{ inputs.shard }}
        run: bash payload/bootstrap.sh "$SHARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: node115-addendum-${{ inputs.shard }}-receipts
          path: probe-receipts/
