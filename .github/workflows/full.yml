name: Node115 BLST exact candidate complete serial suite
on:
  push:
    branches: [validation/node115-blst-full-suite-20261108]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lalalune/hyperliquid-source
          ref: 0781ce04826eeefd89fe336cb8ea073be0c1de30
          path: acquired
          persist-credentials: false
          lfs: true
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Run complete serial suite offline
        working-directory: control
        run: bash payload/bootstrap.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: node115-blst-full-suite-receipts
          path: probe-receipts/
