name: Node115 second-alternative exact candidate validation
on:
  push:
    branches: [validation/node115-second-alternative-checks-20261103-0946]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: clutchpbcfo/hyperliquid-source
          ref: 9705e598770c996c409b0d423ecba96b4cc27798
          persist-credentials: false
          lfs: true
          submodules: recursive
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lalalune/hyperliquid-source
          ref: 8fd8db680ec4bfef40996e5616bce3d5156d0b86
          persist-credentials: false
          lfs: true
          submodules: recursive
          path: base-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Acquire pinned inputs and run rootless offline checks
        working-directory: validation
        run: bash payload/bootstrap.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: node115-second-alternative-required-receipts
          path: |
            probe-receipts/*.json
            probe-receipts/*.stdout
            probe-receipts/*.stderr
