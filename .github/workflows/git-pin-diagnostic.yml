name: Bounded Git pin-access diagnostic
on:
  push:
    branches: [validation/hyper-git-pin-access-20261102-0139]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lalalune/hyperliquid-source
          ref: 56c0ec672bd8fdcfaa80f2db700a61e6240b3663
          persist-credentials: false
          lfs: true
          submodules: recursive
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Qualify rootless offline Git diagnostics
        working-directory: validation
        run: bash payload/bootstrap.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hyper-git-pin-access-diagnostic
          path: |
            diagnostic-receipts/*.json
            diagnostic-receipts/*.stdout
            diagnostic-receipts/*.stderr
