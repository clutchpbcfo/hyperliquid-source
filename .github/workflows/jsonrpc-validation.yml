name: Bounded complete-suite JsonRpcResult validation
on:
  push:
    branches: [validation/hyper-jsonrpc-lfs-full-20261102]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lalalune/hyperliquid-source
          ref: e5c9b6436876b2a4a39daef813171f9879317699
          persist-credentials: false
          lfs: true
          submodules: recursive
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - name: Acquire pinned inputs and run rootless offline checks
        working-directory: validation
        run: bash payload/bootstrap.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hyper-jsonrpc-complete-suite-validation
          path: |
            probe-receipts/*.json
            probe-receipts/*.stdout
            probe-receipts/*.stderr
